services:
  - type: web
    name: ayur-intel
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: AYURINTEL_DEMO_MODE
        value: "true"
      - key: AYURINTEL_DEBUG
        value: "false"
      - key: AYURINTEL_CORS_ALLOW_ORIGINS
        value: "*"
      - key: AYURINTEL_SESSION_SECRET
        generateValue: true
